<div
  class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 md:p-10 animate-in fade-in duration-300">
  <!-- Backdrop -->
  <div
    (click)="onClose.emit()"
    class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity"></div>

  <!-- Modal Container -->
  <div
    class="relative w-full max-w-5xl aspect-video bg-md-sys-dark-surface-container rounded-3xl overflow-hidden shadow-2xl border border-white/10 animate-in zoom-in-95 duration-500 delay-150">
    <!-- Header/Close button (visible on hover) -->
    <div
      class="absolute top-4 right-4 z-10 opacity-0 group-hover:opacity-100 transition-opacity">
      <button
        (click)="onClose.emit()"
        class="p-2 rounded-full bg-black/50 text-white hover:bg-black/70 backdrop-blur-md">
        <svg class="w-6 h-6">
          <use href="#icon-close"></use>
        </svg>
      </button>
    </div>

    <!-- The Iframe -->
    @if (videoUrl) {
    <iframe
      [src]="videoUrl"
      class="w-full h-full border-none shadow-inner"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
    } @else {
    <div
      class="w-full h-full flex flex-col items-center justify-center space-y-4">
      <div
        class="animate-spin h-12 w-12 border-4 border-md-sys-dark-primary border-t-transparent rounded-full"></div>
      <p class="text-md-sys-dark-outline font-display">
        Cargando contenido del vídeo...
      </p>
    </div>
    }

    <!-- Fallback Close for Mobile (always visible) -->
    <button
      (click)="onClose.emit()"
      class="absolute top-4 right-4 p-3 rounded-full bg-md-sys-dark-surface-container-high/60 backdrop-blur-md border border-white/10 text-md-sys-dark-on-surface shadow-lg sm:hidden">
      <svg class="w-5 h-5">
        <use href="#icon-close"></use>
      </svg>
    </button>
  </div>
</div>
