<div
  [class]="
    'group relative rounded-3xl overflow-hidden transition-all duration-500 hover:shadow-2xl hover:-translate-y-1 h-full flex flex-col ' +
    platformClasses
  ">
  <!-- Image/Thumbnail Container -->
  <div class="h-32 sm:h-40 w-full p-[10px] relative">
    @if (link.imageUrl) {
      <img
        [src]="link.imageUrl"
        (error)="handleImageError($event)"
        class="w-full h-full object-cover rounded-2xl transition-transform duration-700 group-hover:scale-105"
        alt="Thumbnail" />
    } @else {
      <img
        [src]="defaultImage"
        class="w-full h-full object-cover rounded-2xl opacity-40 grayscale"
        alt="Default Thumbnail" />
    }

    <!-- Platform Badge -->
    @if (link.platform) {
      <div
        [class]="
          'absolute top-2 right-2 px-2 py-1 rounded-lg text-[8px] font-bold tracking-wider uppercase shadow-lg backdrop-blur-md border border-white/10 ' +
          platformBadgeClasses
        ">
        {{ link.platform }}
      </div>
    }

    <!-- Play Button Overlay -->
    @if (isPlayable) {
      <div
        (click)="onPlay.emit(link); $event.stopPropagation()"
        class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-black/40 transition-colors cursor-pointer z-10">
        <div
          class="w-12 h-12 flex items-center justify-center rounded-full bg-md-sys-dark-primary text-md-sys-dark-on-primary shadow-xl scale-90 group-hover:scale-100 transition-transform text-white">
          <svg class="w-6 h-6">
            <use href="#icon-play"></use>
          </svg>
        </div>
      </div>
    }
  </div>

  <!-- Content -->
  <div class="p-3 sm:p-4 flex flex-col flex-1">
    <div class="flex-1">
      <!-- Title -->
      <h3
        class="font-display font-medium text-sm sm:text-base text-md-sys-dark-on-surface leading-tight line-clamp-2 group-hover:text-md-sys-dark-primary transition-colors mb-1">
        <a [href]="link.url" target="_blank" class="focus:outline-none">
          <span aria-hidden="true" class="absolute inset-0"></span>
          {{ link.title }}
        </a>
      </h3>

      <!-- Description -->
      @if (link.description) {
        <p
          class="line-clamp-2 text-[11px] sm:text-xs text-md-sys-dark-outline leading-tight">
          {{ link.description }}
        </p>
      }
    </div>

    <!-- Footer / Actions -->
    <div
      class="flex items-center justify-between mt-2 pt-2 border-t border-white/10">
      <div
        class="flex items-center gap-1.5 text-xs text-md-sys-dark-outline font-medium">
        <span
          class="capitalize text-md-sys-dark-primary/90 font-bold tracking-tight rounded-full border border-white/10 px-2 py-1"
          >{{ categoryName }}</span
        >
      </div>

      @if (authService.currentUser()) {
        <div class="flex gap-0.5 relative z-10">
          <!-- Edit Button -->
          <button
            (click)="onEdit.emit(link); $event.stopPropagation()"
            class="p-1.5 hover:bg-md-sys-dark-surface rounded-full text-md-sys-dark-outline hover:text-md-sys-dark-primary transition-colors"
            title="Edit">
            <svg class="w-3.5 h-3.5">
              <use href="#icon-edit"></use>
            </svg>
          </button>

          <!-- Delete Button -->
          <button
            (click)="onDelete.emit(link.id); $event.stopPropagation()"
            class="p-1.5 hover:bg-md-sys-dark-surface rounded-full text-md-sys-dark-outline hover:text-red-400 transition-colors"
            title="Delete">
            <svg class="w-3.5 h-3.5">
              <use href="#icon-delete"></use>
            </svg>
          </button>
        </div>
      }
    </div>
  </div>
</div>
