<div
  class="estrellitas fixed inset-0 bg-md-sys-dark-surface z-50 overflow-y-auto">
  <div class="min-h-screen flex items-center justify-center p-4">
    <!-- Main Card/Dialog -->
    <div
      class="w-full max-w-lg bg-md-sys-dark-surface-container rounded-[28px] p-6 shadow-2xl border border-md-sys-dark-outline-variant/20 animate-in zoom-in-95 duration-300">
      <!-- Header -->
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-2xl font-display text-md-sys-dark-on-surface">
          {{ isEdit ? 'Editar Enlace' : 'Nuevo Enlace' }}
        </h2>
        <button
          (click)="cancel()"
          class="p-2 rounded-full hover:bg-md-sys-dark-surface-container-high text-md-sys-dark-outline transition-colors">
          <svg class="w-6 h-6">
            <use href="#icon-close"></use>
          </svg>
        </button>
      </div>

      <div class="space-y-6">
        <!-- URL Input (Material Text Field Style) -->
        <div class="relative group">
          <div
            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-md-sys-dark-outline">
              <use href="#icon-link"></use>
            </svg>
          </div>
          <input
            type="text"
            [(ngModel)]="url"
            (ngModelChange)="onUrlChange()"
            placeholder="Pega la URL aquí"
            class="block w-full pl-12 pr-20 py-4 rounded-xl bg-md-sys-dark-surface-container-high border-none text-md-sys-dark-on-surface placeholder:text-md-sys-dark-outline/50 focus:ring-2 focus:ring-md-sys-dark-primary transition-all text-lg" />
          <div class="absolute inset-y-0 right-2 flex items-center">
            <button
              (click)="fetchMetadata()"
              [disabled]="loadingMetadata() || !url"
              class="px-4 py-1.5 rounded-lg text-sm font-medium text-md-sys-dark-primary hover:bg-md-sys-dark-primary/10 disabled:opacity-50 disabled:hover:bg-transparent transition-colors flex items-center justify-center min-w-[80px]">
              @if (loadingMetadata()) {
              <svg
                class="animate-spin h-5 w-5 text-md-sys-dark-primary"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24">
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              } @else { Analizar }
            </button>
          </div>
        </div>

        @if (fetchedData()) {
        <div
          class="bg-md-sys-dark-surface rounded-2xl overflow-hidden flex flex-col border border-md-sys-dark-outline-variant/30 animate-in slide-in-from-top-2">
          @if (fetchedData()?.imageUrl) {
          <img
            [src]="fetchedData()?.imageUrl"
            class="w-full h-48 object-cover bg-md-sys-dark-surface-container-high border-b border-md-sys-dark-outline-variant/30" />
          }
          <div class="p-4 space-y-4">
            <div>
              <label
                class="block text-[10px] font-bold tracking-widest text-md-sys-dark-primary mb-1 uppercase"
                >Título</label
              >
              <input
                [(ngModel)]="fetchedData()!.title"
                class="w-full bg-transparent border-b border-md-sys-dark-outline-variant focus:border-md-sys-dark-primary outline-none py-1 text-md-sys-dark-on-surface font-medium transition-colors" />
            </div>
            <div>
              <label
                class="block text-[10px] font-bold tracking-widest text-md-sys-dark-outline mb-1 uppercase"
                >Descripción</label
              >
              <textarea
                [(ngModel)]="fetchedData()!.description"
                rows="4"
                class="w-full bg-transparent border-b border-md-sys-dark-outline-variant focus:border-md-sys-dark-primary outline-none py-1 text-sm text-md-sys-dark-on-surface/80 resize-none transition-colors"></textarea>
            </div>
          </div>
        </div>
        }

        <!-- Category Selector -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label
              class="block text-sm font-medium text-md-sys-dark-on-surface ml-1"
              >Categoría</label
            >
            <button
              (click)="isCreatingCategory.set(!isCreatingCategory())"
              class="text-xs font-medium text-md-sys-dark-primary hover:text-md-sys-dark-primary/80 transition-colors uppercase tracking-wide">
              {{
                isCreatingCategory() ? 'Seleccionar existente' : '+ Crear nueva'
              }}
            </button>
          </div>

          @if (isCreatingCategory()) {
          <div class="flex gap-2 animate-in fade-in slide-in-from-left-2">
            <input
              type="text"
              [(ngModel)]="newCategoryName"
              placeholder="Nombre de la categoría..."
              (keydown.enter)="createNewCategory()"
              class="block w-full px-4 py-3.5 rounded-xl bg-md-sys-dark-surface-container-high border-none text-md-sys-dark-on-surface placeholder:text-md-sys-dark-outline/50 focus:ring-2 focus:ring-md-sys-dark-primary transition-all" />
            <button
              (click)="createNewCategory()"
              [disabled]="creatingCategory() || !newCategoryName"
              class="px-4 py-2 bg-md-sys-dark-primary text-md-sys-dark-on-primary rounded-xl font-medium disabled:opacity-50">
              {{ creatingCategory() ? '...' : 'Añadir' }}
            </button>
          </div>
          } @else {
          <select
            [(ngModel)]="category"
            class="w-full rounded-xl border-none p-4 bg-md-sys-dark-surface-container-high text-md-sys-dark-on-surface focus:ring-2 focus:ring-md-sys-dark-primary cursor-pointer appearance-none animate-in fade-in">
            @for (cat of categoryService.categories(); track cat.id) {
            <option [value]="cat.id">{{ cat.name }}</option>
            } @if (categoryService.categories().length === 0) {
            <option value="general">Colección General</option>
            }
          </select>
          }
        </div>

        <!-- Quick Actions (Copy/Share) - Only in Edit mode -->
        @if (isEdit && url) {
        <div class="flex gap-3 animate-in slide-in-from-top-1">
          <button
            (click)="copyLink()"
            class="flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-md-sys-dark-surface-container-high hover:bg-md-sys-dark-surface-container-highest text-md-sys-dark-primary transition-all active:scale-95 border border-md-sys-dark-outline-variant/10">
            @if (showCopySuccess()) {
            <svg class="w-5 h-5 text-emerald-400">
              <use href="#icon-check"></use>
            </svg>
            <span class="text-xs font-bold text-emerald-400">¡Copiado!</span>
            } @else {
            <svg class="w-5 h-5">
              <use href="#icon-copy"></use>
            </svg>
            <span
              class="text-xs font-bold uppercase tracking-wider text-md-sys-dark-on-surface"
              >Copy Link</span
            >
            }
          </button>

          <button
            (click)="shareLink()"
            class="flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-md-sys-dark-surface-container-high hover:bg-md-sys-dark-surface-container-highest text-md-sys-dark-primary transition-all active:scale-95 border border-md-sys-dark-outline-variant/10">
            <svg class="w-5 h-5">
              <use href="#icon-share"></use>
            </svg>
            <span
              class="text-xs font-bold uppercase tracking-wider text-md-sys-dark-on-surface"
              >Share</span
            >
          </button>
        </div>
        }

        <!-- Actions -->
        <div class="flex justify-end gap-3 pt-4">
          <button
            (click)="cancel()"
            class="px-6 py-3 rounded-full font-medium text-md-sys-dark-primary hover:bg-md-sys-dark-primary/10 transition-colors">
            Cancelar
          </button>
          <button
            (click)="save()"
            [disabled]="!url || loading()"
            class="px-8 py-3 rounded-full font-medium bg-md-sys-dark-primary text-md-sys-dark-on-primary shadow-lg shadow-md-sys-dark-primary/20 hover:shadow-xl hover:scale-105 active:scale-95 transition-all disabled:opacity-50 disabled:hover:scale-100">
            {{ loading() ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
